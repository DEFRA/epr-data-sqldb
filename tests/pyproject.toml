[project]
name = "epr-obligation-determination-sql-tests"
version = "0.1.0-dev.0"
description = "SQL Server scenario tests for dbo.sp_producer_obligation_determination."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov==7.0.0",
    "pandas>=1.3.0",
    "pymssql>=2.3.0",
    "testcontainers[mssql]>=4.0.0",
]

# This is a test-only harness, not a distributable package - there are no
# importable packages to build, so tell setuptools not to auto-discover any.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests",
    "scenario: marks tests as scenario tests",
    "e2e: marks tests as end-to-end tests",
]
